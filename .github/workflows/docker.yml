# Builds the image and publishes it to ghcr.io/kenzoportela/cybertools, for amd64
# and arm64: on every push to main (latest), on every push to dev (dev) and on
# every vX.Y.Z tag (version).
# On a pull request the image is built but not published.
name: Docker image

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kenzoportela/cybertools

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # The build stage runs on the runner's own platform (see the Dockerfile);
      # only the final nginx image is built per architecture.
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          # Une pull request ne vérifie que la construction : une seule
          # architecture suffit, les deux ne sont publiées que sur main, dev et sur un tag.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
