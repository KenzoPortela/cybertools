# cybertools behind a reverse proxy (Traefik, Caddy, nginx, or a platform
# that manages one for you).
#
# Standalone setup: no ports are published on the host; the proxy connects to
# the container on port 8080 via the Docker network. Use as-is:
#
#   docker compose -f docker-compose.proxy.yml up -d
#
# (The docker-compose.yml file, by contrast, publishes port 8080 on the host:
# this is the simplest approach when using only Docker, but it conflicts
# with a proxy already listening on that port.)

services:
  cybertools:
    image: ghcr.io/kenzoportela/cybertools:${CYBERTOOLS_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
