  # Titres et descriptions des outils d'IT-Tools. En anglais, on garde les leurs.
  tools:
    ascii-text-drawer:
      title: Générateur de texte ASCII art
      description: Créez du texte en ASCII art avec de nombreuses polices et styles.
    base-converter:
      title: Convertisseur de bases numériques
      description: "Convertissez un nombre entre différentes bases : décimale, hexadécimale, binaire, octale, base64…"
    base64-file-converter:
      title: Fichier vers Base64
      description: Convertissez un texte, un fichier ou une image en Base64, et inversement.
    base64-string-converter:
      title: Encodeur / décodeur Base64
      description: Encodez et décodez du texte en Base64.
    basic-auth-generator:
      title: Générateur d’en-tête Basic Auth
      description: Générez l’en-tête d’authentification Basic, encodé en Base64, à partir d’un identifiant et d’un mot de passe.
    bcrypt:
      title: Bcrypt
      description: Hachez et comparez du texte avec bcrypt, une fonction de hachage de mots de passe fondée sur l’algorithme Blowfish.
    benchmark-builder:
      title: Banc d’essai de performances
      description: Comparez simplement le temps d’exécution de plusieurs tâches.
    bip39-generator:
      title: Générateur de phrase BIP39
      description: Générez une phrase de passe BIP39 à partir d’un mnémonique existant ou aléatoire, ou retrouvez le mnémonique depuis la phrase.
    camera-recorder:
      title: Enregistreur de caméra
      description: Prenez une photo ou enregistrez une vidéo depuis votre webcam.
    case-converter:
      title: Convertisseur de casse
      description: "Changez la casse d’un texte : camelCase, snake_case, kebab-case, MAJUSCULES…"
    chmod-calculator:
      title: Calculateur chmod
      description: Calculez vos permissions chmod et la commande correspondante.
    chronometer:
      title: Chronomètre
      description: Mesurez une durée avec un chronomètre simple.
    color-converter:
      title: Convertisseur de couleurs
      description: Convertissez une couleur entre les formats hex, RGB, HSL, CMJN et nom CSS.
    crontab-generator:
      title: Générateur de crontab
      description: Validez et générez une expression cron, avec sa description en clair.
    date-converter:
      title: Convertisseur de dates
      description: "Convertissez une date et une heure dans différents formats : ISO 8601, timestamp Unix, RFC…"
    device-information:
      title: Informations sur l’appareil
      description: "Affichez les informations de votre appareil : taille d’écran, densité de pixels, user-agent…"
    docker-run-to-docker-compose-converter:
      title: docker run vers docker-compose
      description: Transformez une commande « docker run » en fichier docker-compose.
    email-normalizer:
      title: Normaliseur d’e-mails
      description: Ramenez des adresses e-mail à un format standard pour les comparer et les dédoublonner plus facilement.
    emoji-picker:
      title: Sélecteur d’emojis
      description: Copiez facilement des emojis et obtenez leur valeur Unicode et leurs points de code.
    encryption:
      title: Chiffrer / déchiffrer du texte
      description: Chiffrez et déchiffrez du texte avec AES, TripleDES, Rabbit ou RC4.
    eta-calculator:
      title: Calculateur d’heure de fin
      description: Estimez l’heure de fin et la durée d’une tâche, par exemple un téléchargement.
    git-memo:
      title: Aide-mémoire Git
      description: Les commandes Git les plus courantes, à portée de main.
    hash-text:
      title: Hacher du texte
      description: "Calculez l’empreinte d’un texte : MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 ou RIPEMD160."
    hmac-generator:
      title: Générateur HMAC
      description: Calculez un code d’authentification de message (HMAC) avec une clé secrète et la fonction de hachage de votre choix.
    html-entities:
      title: Échapper les entités HTML
      description: "Échappez ou déséchappez les entités HTML : chevrons, esperluette, guillemets et apostrophes."
    html-wysiwyg-editor:
      title: Éditeur HTML visuel
      description: Un éditeur WYSIWYG qui génère instantanément le code HTML du contenu.
    http-status-codes:
      title: Codes de statut HTTP
      description: La liste de tous les codes de statut HTTP, leur nom et leur signification.
    iban-validator-and-parser:
      title: Validateur d’IBAN
      description: "Validez et analysez un IBAN : pays, BBAN, QR-IBAN et format lisible."
    ipv4-address-converter:
      title: Convertisseur d’adresse IPv4
      description: Convertissez une adresse IP en décimal, binaire, hexadécimal ou en représentation IPv6.
    ipv4-range-expander:
      title: Plage IPv4 vers sous-réseau
      description: À partir d’une adresse IPv4 de début et de fin, calculez un sous-réseau valide et sa notation CIDR.
    ipv4-subnet-calculator:
      title: Calculateur de sous-réseau IPv4
      description: Analysez un bloc CIDR IPv4 et obtenez toutes les informations sur le sous-réseau.
    ipv6-ula-generator:
      title: Générateur d’adresses IPv6 ULA
      description: Générez des adresses IPv6 locales, non routables, pour votre réseau, selon la RFC 4193.
    json-diff:
      title: Comparaison de JSON
      description: Comparez deux objets JSON et affichez leurs différences.
    json-minify:
      title: Minifier du JSON
      description: Compressez votre JSON en supprimant les espaces inutiles.
    json-prettify:
      title: Formater du JSON
      description: Mettez en forme une chaîne JSON pour la rendre lisible.
    json-to-csv:
      title: JSON vers CSV
      description: Convertissez du JSON en CSV, avec détection automatique des en-têtes.
    json-to-toml:
      title: JSON vers TOML
      description: Convertissez du JSON en TOML.
    json-to-xml:
      title: JSON vers XML
      description: Convertissez du JSON en XML.
    json-to-yaml-converter:
      title: JSON vers YAML
      description: Convertissez du JSON en YAML, en direct.
    jwt-parser:
      title: Décodeur JWT
      description: Analysez et décodez un JSON Web Token (JWT) pour afficher son contenu.
    keycode-info:
      title: Informations sur les touches
      description: Obtenez le keycode, le code, l’emplacement et les modificateurs JavaScript de n’importe quelle touche pressée.
    list-converter:
      title: Convertisseur de listes
      description: "Transformez des données en colonnes : transposer, ajouter un préfixe ou un suffixe, inverser, trier, mettre en minuscules, tronquer…"
    lorem-ipsum-generator:
      title: Générateur de lorem ipsum
      description: Générez du faux texte pour illustrer la mise en page d’un document ou d’une police sans contenu réel.
    mac-address-generator:
      title: Générateur d’adresses MAC
      description: Générez des adresses MAC avec le préfixe, la quantité et la casse de votre choix.
    mac-address-lookup:
      title: Recherche d’adresse MAC
      description: Trouvez le fabricant d’un appareil à partir de son adresse MAC.
    markdown-to-html:
      title: Markdown vers HTML
      description: Convertissez du Markdown en HTML, et imprimez le résultat, en PDF par exemple.
    math-evaluator:
      title: Évaluateur mathématique
      description: Une calculatrice pour évaluer des expressions mathématiques, avec des fonctions comme sqrt, cos, sin, abs…
    mime-types:
      title: Types MIME
      description: Convertissez des types MIME en extensions de fichier, et inversement.
    numeronym-generator:
      title: Générateur de numéronymes
      description: "Un numéronyme abrège un mot à l’aide d’un nombre : « i18n » pour « internationalization », 18 étant le nombre de lettres entre le premier i et le dernier n."
    og-meta-generator:
      title: Générateur de balises Open Graph
      description: Générez les balises meta Open Graph et réseaux sociaux de votre site.
    otp-generator:
      title: Générateur de codes OTP
      description: Générez et validez des mots de passe à usage unique basés sur le temps (TOTP), pour l’authentification à plusieurs facteurs.
    password-strength-analyser:
      title: Robustesse d’un mot de passe
      description: Évaluez la robustesse d’un mot de passe et le temps nécessaire pour le casser. Tout est calculé localement.
    pdf-signature-checker:
      title: Vérificateur de signature PDF
      description: Vérifiez les signatures d’un fichier PDF, qui permettent de savoir si son contenu a été modifié depuis sa signature.
    percentage-calculator:
      title: Calculateur de pourcentages
      description: Calculez facilement un pourcentage d’une valeur, ou la variation en pourcentage entre deux valeurs.
    phone-parser-and-formatter:
      title: Analyseur de numéro de téléphone
      description: "Analysez, validez et formatez un numéro de téléphone : indicatif pays, type de ligne…"
    qrcode-generator:
      title: Générateur de QR code
      description: Générez et téléchargez un QR code pour une URL ou du texte, avec les couleurs de votre choix.
    random-port-generator:
      title: Générateur de port aléatoire
      description: Générez des numéros de port aléatoires hors de la plage des ports réservés (0-1023).
    regex-memo:
      title: Aide-mémoire des regex
      description: Aide-mémoire des expressions régulières JavaScript.
    regex-tester:
      title: Testeur de regex
      description: Testez vos expressions régulières sur un texte d’exemple.
    roman-numeral-converter:
      title: Convertisseur de chiffres romains
      description: Convertissez des chiffres romains en nombres, et inversement.
    rsa-key-pair-generator:
      title: Générateur de paire de clés RSA
      description: Générez une nouvelle paire de clés RSA, privée et publique, au format PEM.
    safelink-decoder:
      title: Décodeur de liens Outlook Safelink
      description: Décodez les liens Safelink d’Outlook pour retrouver l’URL d’origine.
    slugify-string:
      title: Slugifier un texte
      description: Rendez un texte utilisable dans une URL, un nom de fichier ou un identifiant.
    sql-prettify:
      title: Formater du SQL
      description: Mettez en forme vos requêtes SQL, pour de nombreux dialectes.
    string-obfuscator:
      title: Masqueur de texte
      description: Masquez une chaîne (secret, IBAN, jeton) pour la partager et la reconnaître sans en révéler le contenu.
    svg-placeholder-generator:
      title: Générateur d’images SVG de substitution
      description: Générez des images SVG à utiliser comme espaces réservés dans vos applications.
    temperature-converter:
      title: Convertisseur de températures
      description: Convertissez des températures entre Kelvin, Celsius, Fahrenheit, Rankine, Delisle, Newton, Réaumur et Rømer.
    text-diff:
      title: Comparaison de textes
      description: Comparez deux textes et visualisez leurs différences.
    text-statistics:
      title: Statistiques de texte
      description: "Obtenez des informations sur un texte : nombre de caractères, de mots, taille en octets…"
    text-to-binary:
      title: Texte vers binaire ASCII
      description: Convertissez du texte en binaire ASCII, et inversement.
    text-to-nato-alphabet:
      title: Texte vers alphabet OTAN
      description: Épelez un texte avec l’alphabet phonétique de l’OTAN pour le transmettre à l’oral.
    text-to-unicode:
      title: Texte vers Unicode
      description: Convertissez du texte en Unicode, et inversement.
    token-generator:
      title: Générateur de jetons
      description: "Générez une chaîne aléatoire avec les caractères de votre choix : majuscules, minuscules, chiffres et symboles."
    toml-to-json:
      title: TOML vers JSON
      description: Convertissez du TOML en JSON.
    toml-to-yaml:
      title: TOML vers YAML
      description: Convertissez du TOML en YAML.
    ulid-generator:
      title: Générateur d’ULID
      description: Générez des identifiants uniques triables lexicographiquement (ULID).
    url-encoder:
      title: Encoder / décoder une URL
      description: Encodez du texte au format URL (encodage « pourcent »), ou décodez-le.
    url-parser:
      title: Analyseur d’URL
      description: "Décomposez une URL en ses différentes parties : protocole, origine, paramètres, port, identifiants…"
    user-agent-parser:
      title: Analyseur de user-agent
      description: Détectez le navigateur, le moteur, le système, le processeur et l’appareil à partir d’une chaîne user-agent.
    uuid-generator:
      title: Générateur d’UUID
      description: Générez des identifiants universels uniques (UUID) de 128 bits, en version NIL, v1, v3, v4 ou v5.
    wifi-qrcode-generator:
      title: QR code Wi-Fi
      description: Générez et téléchargez un QR code pour se connecter en un geste à un réseau Wi-Fi.
    xml-formatter:
      title: Formater du XML
      description: Mettez en forme une chaîne XML pour la rendre lisible.
    xml-to-json:
      title: XML vers JSON
      description: Convertissez du XML en JSON.
    yaml-prettify:
      title: Formater du YAML
      description: Mettez en forme une chaîne YAML pour la rendre lisible.
    yaml-to-json-converter:
      title: YAML vers JSON
      description: Convertissez du YAML en JSON, en direct.
    yaml-to-toml:
      title: YAML vers TOML
      description: Convertissez du YAML en TOML.
  native:
    recipes:
      title: Recettes
      description: Enchaînez des opérations CyberChef, voyez le résultat en direct, lancez Magic, partagez ou importez une recette au format de CyberChef.
    magic:
      title: Magic
      description: Détecte automatiquement l’encodage d’une donnée inconnue (base64, hexadécimal, compression…) et propose la recette pour la décoder.
    stegoLab:
      title: Stego Lab
      description: Analysez une image à la recherche de données cachées — métadonnées, plans de bits, LSB, structure. Rien n'est envoyé, tout se passe dans votre navigateur.
