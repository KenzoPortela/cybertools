# cybertools — deployment using the published image (recommended method).
#
# The image is built and published by GitHub Actions to ghcr.io for amd64
# and arm64 architectures; the server does not need to compile anything.
#
#   docker compose up -d                                   → http://localhost:8080
#   CYBERTOOLS_PORT=9000 docker compose up -d              → custom port
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#                                                          → build from source
#
# When using a reverse proxy (Traefik, Caddy, nginx, etc.) that connects to
# the containers via the Docker network: remove the "ports" section and
# allow the proxy to access the container's port 8080.

services:
  cybertools:
    image: ghcr.io/kenzoportela/cybertools:${CYBERTOOLS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${CYBERTOOLS_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
