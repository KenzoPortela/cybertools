# cybertools — déploiement avec l'image publiée (méthode recommandée).
#
# L'image est construite et publiée par GitHub Actions sur ghcr.io, pour amd64
# et arm64 : le serveur n'a rien à compiler.
#
#   docker compose up -d                                   → http://localhost:8080
#   CYBERTOOLS_PORT=9000 docker compose up -d              → autre port
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#                                                          → construire depuis les sources
#
# Derrière un proxy inverse (Traefik, Caddy, nginx…) qui joint les conteneurs
# par le réseau Docker : retirer la section « ports » et laisser le proxy
# atteindre le port 8080 du conteneur.

services:
  cybertools:
    image: ghcr.io/kenzoportela/cybertools:${CYBERTOOLS_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${CYBERTOOLS_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
