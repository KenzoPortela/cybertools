# cybertools : application monopage servie en fichiers statiques.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Derrière un proxy inverse : pas de redirection vers le port interne.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json
               image/svg+xml application/wasm text/plain application/xml;

    # Aucune donnée ne quitte le navigateur : la politique de sécurité interdit
    # toute connexion vers un autre domaine que celui de l'application.
    # 'unsafe-eval' : quelques opérations de CyberChef évaluent du code ;
    # 'unsafe-inline' (styles) : naive-ui injecte ses styles à l'exécution.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: mediastream:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Sonde de santé (healthcheck Docker, supervision).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers de Vite : leur nom contient leur empreinte, ils ne changent jamais.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Moteur CyberChef : noms stables, revalidés à chaque visite (ETag).
    location /cyberchef/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Toute autre adresse est une route de l'application : index.html, jamais
    # mis en cache pour qu'un déploiement soit visible immédiatement.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
