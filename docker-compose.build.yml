# Construire l'image depuis les sources au lieu de la télécharger :
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# La construction clone CyberChef et IT-Tools (révisions de vendor.lock.json) et
# demande environ 4 Go de mémoire et quelques minutes.
services:
  cybertools:
    image: cybertools:local
    build:
      context: .
