# Build the image from source instead of downloading it:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The build process clones CyberChef and IT-Tools (based on vendor.lock.json revisions)
# and requires approximately 4 GB of memory and a few minutes.

services:
  cybertools:
    image: cybertools:local
    build:
      context: .
